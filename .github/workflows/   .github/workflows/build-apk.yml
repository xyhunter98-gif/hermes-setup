name: Build Hermes APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write local.properties from secrets
        env:
          PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY}}
        run: |
          echo "PICOVOICE_ACCESS_KEY=${PICOVOICE_ACCESS_KEY}" >> HermesAssistant/local.properties
          echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}" >> HermesAssistant/local.properties

      - name: Build debug APK
        working-directory: HermesAssistant
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-debug-apk
          path: HermesAssistant/app/build/outputs/apk/debug/app-debug.apk
